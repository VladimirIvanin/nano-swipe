name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:package
      - run: npm run test:docs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            reports/tests.json
            reports/docs-tests.json
            test-results/
          retention-days: 14
